
name: Visit With Us MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================================
  # JOB 1 : DATA VALIDATION
  # ==========================================================
  validate-dataset:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pipeline.txt

      - name: Validate Dataset
        run: |
          python pipeline_components/data_validation/validate_source_data.py

      - name: Upload Validated Dataset
        uses: actions/upload-artifact@v4
        with:
          name: validated-data
          path: data/validated/validated_tourism.csv


  # ==========================================================
  # JOB 2 : DATA PREPARATION
  # ==========================================================
  prepare-dataset:

    needs: validate-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pipeline.txt

      - name: Download Validated Dataset
        uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: data/validated/

      - name: Prepare Dataset
        run: |
          python pipeline_components/data_preparation/prepare_data.py

      - name: Upload Processed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/


  # ==========================================================
  # JOB 3 : MODEL TRAINING
  # ==========================================================
  train-model:

    needs: prepare-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pipeline.txt

      - name: Download Processed Dataset
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Train Model
        run: |
          python pipeline_components/model_training/train_model.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            trained_models/wellness_model.joblib
            trained_models/best_model_parameters.json


  # ==========================================================
  # JOB 4 : MODEL EVALUATION
  # ==========================================================
  evaluate-model:

    needs: train-model

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_pipeline.txt

      - name: Download Processed Dataset
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: trained_models/

      - name: Evaluate Model
        run: |
          python pipeline_components/model_evaluation/evaluate_model.py


  # ==========================================================
  # JOB 5 : COMMIT UPDATED MODEL
  # ==========================================================
  commit-model:

    needs: evaluate-model

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: trained_models/

      - name: Commit Updated Model
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trained_models/

          if git diff --cached --quiet; then
            echo "No model changes detected."
            exit 0
          fi

          git commit -m "Automatically update trained model"

          git push origin main
